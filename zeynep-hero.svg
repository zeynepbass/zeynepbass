<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Zeynep Baş — Frontend Developer</title>
  <desc id="desc">Animated profile banner in burgundy, red and light blue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#432B2B"/><stop offset="1" stop-color="#190F10"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F101B"/><stop offset=".48" stop-color="#C1121F"/><stop offset="1" stop-color="#F05A67"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9FD3F5" opacity=".48">
        <animate attributeName="opacity" values=".18;.65;.18" dur="4s" repeatCount="indefinite"/>
      </circle>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#dots)" opacity=".42"/>
  <path d="M860 0 L1200 0 L1200 180 Z" fill="#C1121F" opacity=".12"/>
  <path d="M960 0 L1200 0 L1200 130 Z" fill="none" stroke="#9FD3F5" stroke-width="1" opacity=".55"/>
  <g fill="none" stroke="#9FD3F5" stroke-width="1.2" opacity=".7">
    <path d="M1000 55 h26 v26 h-26z M1039 55 h26 v26 h-26z M1000 94 h26 v26 h-26z"/>
    <path d="M1078 55 h64 M1078 68 h42 M1078 81 h54"/>
  </g>
  <path d="M0 252 C240 220 340 300 590 254 S970 190 1200 235" fill="none" stroke="#7F101B" stroke-width="3" opacity=".6"/>
  <path d="M0 252 C240 220 340 300 590 254 S970 190 1200 235" fill="none" stroke="url(#red)" stroke-width="2.5" stroke-dasharray="150 1100" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="1250" to="0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M0 267 C260 235 380 310 630 267 S990 210 1200 248" fill="none" stroke="#9FD3F5" stroke-width="1" opacity=".65" stroke-dasharray="45 22">
    <animate attributeName="stroke-dashoffset" from="0" to="-201" dur="8s" repeatCount="indefinite"/>
  </path>
  <text x="76" y="88" fill="#9FD3F5" font-family="monospace" font-size="15" letter-spacing="4">HELLO, I'M</text>
  <text x="72" y="158" fill="#FFF7F3" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Zeynep Baş</text>
  <rect x="76" y="180" width="76" height="4" rx="2" fill="url(#red)">
    <animate attributeName="width" values="18;76;18" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="76" y="215" fill="#F5E9E5" font-family="Arial, Helvetica, sans-serif" font-size="23">Frontend Developer</text>
  <text x="76" y="242" fill="#D8C9C5" font-family="monospace" font-size="15">React.js  ·  Next.js  ·  Architecture &amp; Performance</text>
  <g filter="url(#glow)">
    <circle cx="1128" cy="222" r="4" fill="#C1121F"><animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1144" cy="222" r="4" fill="#9FD3F5"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="222" r="4" fill="#F05A67"><animate attributeName="r" values="4;2.5;4" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>