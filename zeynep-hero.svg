<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="zbHeroTitle zbHeroDesc">
  <title id="zbHeroTitle">Zeynep — Frontend Geliştirici</title>
  <desc id="zbHeroDesc">Bordo tonlarında animasyonlu profil başlığı: React, Next.js ve TypeScript ile mimari ve performans odaklı frontend geliştirme.</desc>
  <defs>
    <linearGradient id="zbHeroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#2A0D1B"/>
    </linearGradient>
    <radialGradient id="zbHeroGlowA" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="cx" values="0.82;0.7;0.82" dur="14s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="zbHeroGlowB" cx="0.12" cy="1" r="0.5">
      <stop offset="0" stop-color="#451126" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zbHeroLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="zbHeroLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="zbHeroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="zbHeroBlur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="zbHeroClip"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#zbHeroClip)">
    <rect width="1200" height="380" fill="url(#zbHeroBg)"/>
    <rect width="1200" height="380" fill="url(#zbHeroGlowA)"/>
    <rect width="1200" height="380" fill="url(#zbHeroGlowB)"/>
    <rect width="1200" height="380" fill="url(#zbHeroGrid)"/>

    <!-- sweeping light -->
    <rect x="-400" y="0" width="400" height="380" fill="url(#zbHeroLight)" transform="skewX(-18)">
      <animate attributeName="x" values="-500;1500" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- orbital geometry -->
    <g transform="translate(960 190)" fill="none" stroke-linecap="round">
      <circle r="132" stroke="#C77B9B" stroke-opacity="0.18"/>
      <circle r="96" stroke="#C77B9B" stroke-opacity="0.12" stroke-dasharray="2 8"/>
      <circle r="58" stroke="#E5B5C7" stroke-opacity="0.22"/>
      <g>
        <ellipse rx="150" ry="52" stroke="#701A3D" stroke-opacity="0.9" stroke-width="1.5"/>
        <circle cx="150" cy="0" r="5" fill="#E5B5C7"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse rx="150" ry="52" stroke="#C77B9B" stroke-opacity="0.45" transform="rotate(60)"/>
        <ellipse rx="150" ry="52" stroke="#C77B9B" stroke-opacity="0.3" transform="rotate(120)"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
      </g>
      <circle r="10" fill="#C77B9B"/>
      <circle r="22" stroke="#E5B5C7" stroke-opacity="0.5">
        <animate attributeName="r" values="14;30;14" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- drawn component-tree path -->
    <path d="M70 352 C 220 352, 260 322, 400 322 S 600 352, 740 332 S 900 300, 1130 312"
          fill="none" stroke="url(#zbHeroLine)" stroke-width="1.6" stroke-opacity="0.75"
          stroke-dasharray="1200" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="1200;0;0" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <g fill="#E5B5C7">
      <circle cx="400" cy="322" r="3.5"/>
      <circle cx="740" cy="332" r="3.5"/>
    </g>

    <!-- labels -->
    <text x="72" y="92" fill="#C77B9B" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" letter-spacing="4">FRONTEND · MİMARİ · PERFORMANS</text>

    <text x="68" y="178" fill="#F8F0F3" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="1">Zeynep</text>

    <!-- glowing underline -->
    <rect x="72" y="202" width="300" height="4" rx="2" fill="#C77B9B" filter="url(#zbHeroBlur)" opacity="0.8">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="202" width="300" height="3" rx="1.5" fill="url(#zbHeroLine)">
      <animate attributeName="width" values="0;300;300" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <text x="72" y="250" fill="#F8F0F3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Frontend Geliştirici</text>
    <text x="72" y="286" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">React.js · Next.js · TypeScript</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="21.5" fill="none" stroke="#701A3D" stroke-width="1.5"/>
</svg>
