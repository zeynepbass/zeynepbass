  <path d="M40 106 H1160" stroke="url(#red)" stroke-width="2" stroke-dasharray="100 1040"><animate attributeName="stroke-dashoffset" from="0" to="-1140" dur="6s" repeatCount="indefinite"/></path>
</svg>