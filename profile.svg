<text x="56" y="256" fill="#F4ECEC" fill-opacity="0.82" font-size="16">Temiz mimari prensiplerine uygun, yeniden kullanılabilir ve performans odaklı komponent yapıları oluşturmayı önemsiyorum.</text>
<text x="56" y="284" fill="#F4ECEC" fill-opacity="0.82" font-size="16">RESTful API entegrasyonlarında deneyimliyim; JIRA ile Agile ekip süreçlerine aktif katkı sağlıyorum.</text>
<text x="56" y="334" fill="#F4ECEC" fill-opacity="0.82" font-size="16">Analitik düşünme yaklaşımıyla, kullanıcı odaklı ve sürdürülebilir çözümler üretirken React ekosistemi ve modern frontend</text>
